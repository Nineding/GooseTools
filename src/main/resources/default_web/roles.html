<!doctype html>

  <link rel="stylesheet" href="styles.css">

<body>
  <nav class="toolbar">
    <span class="brand" data-i18n="brand.name"></span>
    <a href="goose:home" data-i18n="nav.home"></a>
    <a class="nav-active" href="goose:roles" data-i18n="nav.roles"></a>
    <a href="goose:gameplay" data-i18n="nav.gameplay"></a>
    <a href="goose:features" data-i18n="nav.features"></a>
    <button class="lang-short" data-language="zh_cn">简</button>
    <button class="lang-short" data-language="en_us">EN</button>
    <button class="theme-toggle" data-theme="toggle">
      <img class="theme-icon theme-icon-moon" src="images/theme_moon.png">
      <img class="theme-icon theme-icon-sun" src="images/theme_sun.png">
    </button>
  </nav>

  <section class="page-hero roles-hero">
    <div class="hero-copy">
      <p class="eyebrow" data-i18n="roles.eyebrow"></p>
      <h1 data-i18n="roles.title"></h1>
      <p class="lead" data-i18n="roles.intro"></p>
    </div>
    <div class="hero-tip">
      <span class="tip-number">50</span>
      <p data-i18n="roles.hero.tip"></p>
    </div>
  </section>

  <section class="search-panel">
    <p class="mini-label" data-i18n="roles.search.label"></p>
    <input id="role-search" maxlength="80" data-placeholder-i18n="roles.search">
    <div class="filters">
      <button class="filter-active" data-filter="all" data-i18n="roles.filter.all"></button>
      <button data-filter="good" data-mc-translate="text.faction.good"></button>
      <button data-filter="evil" data-mc-translate="text.faction.evil"></button>
      <button data-filter="neutral" data-mc-translate="text.faction.neutral"></button>
    </div>
  </section>

  <div class="results-row">
    <strong id="role-count">50</strong>
    <span class="count-word" data-i18n="roles.count.of"></span>
    <strong id="role-total">50</strong>
    <span class="count-word" data-i18n="roles.count.unit"></span>
    <span class="results-hint" data-i18n="roles.hint"></span>
  </div>
