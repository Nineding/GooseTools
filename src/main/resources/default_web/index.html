<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="official-links-page">
  <nav class="toolbar official-toolbar">
    <span class="brand" data-i18n="brand.name"></span>
    <span class="toolbar-spacer"></span>
    <button class="lang-short" data-language="zh_cn">简</button>
    <button class="lang-short" data-language="en_us">EN</button>
    <button class="theme-toggle" data-theme="toggle">
      <img class="theme-icon theme-icon-moon" src="images/theme_moon.png">
      <img class="theme-icon theme-icon-sun" src="images/theme_sun.png">
    </button>
  </nav>

  <section class="official-hero">
    <p class="eyebrow" data-i18n="official.eyebrow"></p>
    <h1 data-i18n="official.title"></h1>
    <p class="lead" data-i18n="official.subtitle"></p>
  </section>

  <section class="official-link-grid">
    <a class="official-link-card role-guide-link" href="https://goose.worldrealms.top/guide">
      <img src="mc:minecraft:textures/gui/sprites/custom/ggdrole/fortuneteller.png">
      <div>
        <span class="official-link-kicker" data-i18n="official.guide.kicker"></span>
        <h2 data-i18n="official.roles.title"></h2>
        <p data-i18n="official.roles.desc"></p>
        <span class="official-open" data-i18n="official.open"></span>
      </div>
    </a>

    <a class="official-link-card gameplay-guide-link" href="https://goose.worldrealms.top/guide/gameplay">
      <img src="mc:minecraft:textures/gui/sprites/custom/ggdrole/detective.png">
      <div>
        <span class="official-link-kicker" data-i18n="official.guide.kicker"></span>
        <h2 data-i18n="official.gameplay.title"></h2>
        <p data-i18n="official.gameplay.desc"></p>
        <span class="official-open" data-i18n="official.open"></span>
      </div>
    </a>

    <a class="official-link-card modes-guide-link" href="https://goose.worldrealms.top/guide/modes">
      <img src="mc:minecraft:textures/item/game_guide.png">
      <div>
        <span class="official-link-kicker" data-i18n="official.guide.kicker"></span>
        <h2 data-i18n="official.modes.title"></h2>
        <p data-i18n="official.modes.desc"></p>
        <span class="official-open" data-i18n="official.open"></span>
      </div>
    </a>

    <a class="official-link-card website-link" href="https://goose.worldrealms.top/">
      <img src="mc:minecraft:textures/gui/sprites/custom/ggdrole/goose.png">
      <div>
        <span class="official-link-kicker" data-i18n="official.website.kicker"></span>
        <h2 data-i18n="official.website.title"></h2>
        <p data-i18n="official.website.desc"></p>
        <span class="official-open" data-i18n="official.open"></span>
      </div>
    </a>
  </section>

  <section class="external-note">
    <span class="note-mark">i</span>
    <div>
      <h3 data-i18n="official.note.title"></h3>
      <p data-i18n="official.note.body"></p>
    </div>
  </section>
</body>
</html>
