allprojects { afterEvaluate {
 def fixture=file('src/irisOutlineTest')
 def run=file(providers.gradleProperty('irisTestRun').get())
 def shader=file(providers.gradleProperty('irisTestShader').get())
 sourceSets { irisOutlineSmoke {
  java.setSrcDirs([new File(fixture,'java')]); resources.setSrcDirs([new File(fixture,'resources')])
  compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
  runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
 } }
 configurations { irisOutlineSmokeImplementation.extendsFrom implementation; irisOutlineSmokeRuntimeOnly.extendsFrom runtimeOnly }
 dependencies { irisOutlineSmokeRuntimeOnly fileTree(dir:providers.gradleProperty('irisTestMods').get(),include:['iris-*.jar','sodium-*.jar','ImmediatelyFast-*.jar']) }
 loom { mods { iris_outline_smoke { sourceSet sourceSets.irisOutlineSmoke } }; runs { irisOutlineSmoke { client(); source sourceSets.irisOutlineSmoke; runDir run.absolutePath; vmArg '-Dgoosetools.irisTestPack='+shader.name; programArg '--width';programArg '960';programArg '--height';programArg '640' } } }
 tasks.named('runIrisOutlineSmoke') { timeout=java.time.Duration.ofMinutes(6); doFirst {
