name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build and test
        run: bash ./gradlew clean test build

      - name: Prepare release from Changelog
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            python3 scripts/release_info.py "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/release_info.py >> "$GITHUB_OUTPUT"
          fi

      - name: Hash tested runtime JAR
        id: digest
        env:
          JAR_PATH: ${{ steps.release.outputs.jar }}
        run: echo "sha256=$(sha256sum "$JAR_PATH" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload runtime JAR and Changelog entry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            ${{ steps.release.outputs.jar }}
            build/release-notes.md
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested release artifact
        uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - name: Publish runtime JAR with Changelog notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          version="$VERSION"
          tag="v$version"
          printf '%s  %s\n' "$EXPECTED_SHA256" "release/libs/goosetools-$version.jar" | sha256sum --check --strict
          args=()
          if [[ "$version" == *Alpha* ]]; then
            args+=(--prerelease --latest=false)
          fi
          existing_tags="$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name')"
          if grep -Fxq -- "$tag" <<< "$existing_tags"; then
            echo "Release $tag already exists; preserving its assets."
            exit 0
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            args+=(--verify-tag)
          else
            args+=(--target "$GITHUB_SHA")
          fi
          gh release create "$tag" \
            "release/libs/goosetools-$version.jar" \
            --title "GooseTools $version" \
            --notes-file release/release-notes.md "${args[@]}"
