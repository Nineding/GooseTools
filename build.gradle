plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "Xaero's Maven"
        url = "https://chocolateminecraft.com/maven"
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "xaero.minimap:xaerominimap-fabric-${minecraft_version}:${xaero_version}"
    implementation "xaero.map:xaeroworldmap-fabric-${minecraft_version}:${xaero_world_map_version}"

    // Embedded, client-safe libraries for the restricted server-driven Web UI.
    include(implementation("org.jsoup:jsoup:1.18.3"))
    include(implementation("org.mozilla:rhino:1.7.15"))

    testImplementation("org.junit.jupiter:junit-jupiter:5.11.4")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher:1.11.4")
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

test {
    useJUnitPlatform()
}

// One published runtime JAR contains an independent pre-launch updater. No Minecraft classes
// enter its class path, and its dependencies are private to the separate updater JVM.
def standaloneUpdater = tasks.register('standaloneUpdater', Jar) {
    dependsOn tasks.named('classes')
    archiveFileName = 'updater.jar'
    destinationDirectory = layout.buildDirectory.dir('updater')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes 'Main-Class': 'com.goosethings.tools.client.update.bootstrap.GooseToolsBootstrap' }
    from(sourceSets.main.output.classesDirs) {
        include 'com/goosethings/tools/client/update/bootstrap/**'
        include 'com/goosethings/tools/client/update/GitHubUpdateClient*'
        include 'com/goosethings/tools/client/update/UpdateMonitor*'
        include 'com/goosethings/tools/client/update/UpdateVersion*'
        include 'com/goosethings/tools/client/update/UpdatePreferences*'
        include 'com/goosethings/tools/client/update/UpdateProxySelector*'
    }
    from('src/main/resources') { include 'assets/goosetools/lang/en_us.json', 'assets/goosetools/lang/zh_cn.json' }
    from({ configurations.compileClasspath.findAll {
        it.name.startsWith('gson-') || it.name.startsWith('fabric-loader-')
    }.collect { zipTree(it) } }) {
        exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'module-info.class', 'META-INF/versions/**/module-info.class'
    }
}
tasks.named('jar') {
    dependsOn standaloneUpdater
    from(standaloneUpdater.flatMap { it.archiveFile }) { into 'META-INF/goosetools' }
}

// An isolated client mod exercises real GPU draws; it is never packaged in the release JAR.
sourceSets {
    stationRegressionTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    gameRegressionTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    updateRegressionTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    taskRegressionTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    xaeroRegressionTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    cameraRenderTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    flightRegressionTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
configurations {
    stationRegressionTestImplementation.extendsFrom implementation
    stationRegressionTestRuntimeOnly.extendsFrom runtimeOnly
    gameRegressionTestImplementation.extendsFrom implementation
    gameRegressionTestRuntimeOnly.extendsFrom runtimeOnly
    updateRegressionTestImplementation.extendsFrom implementation
    updateRegressionTestRuntimeOnly.extendsFrom runtimeOnly
    taskRegressionTestImplementation.extendsFrom implementation
    taskRegressionTestRuntimeOnly.extendsFrom runtimeOnly
    xaeroRegressionTestImplementation.extendsFrom implementation
    xaeroRegressionTestRuntimeOnly.extendsFrom runtimeOnly
    cameraRenderTestImplementation.extendsFrom implementation
    cameraRenderTestRuntimeOnly.extendsFrom runtimeOnly
    flightRegressionTestImplementation.extendsFrom implementation
    flightRegressionTestRuntimeOnly.extendsFrom runtimeOnly
}
loom {
    mods {
        goosetools_station_test { sourceSet sourceSets.stationRegressionTest }
        goosetools_game_test { sourceSet sourceSets.gameRegressionTest }
        goosetools_update_test { sourceSet sourceSets.updateRegressionTest }
        goosetools_task_test { sourceSet sourceSets.taskRegressionTest }
        goosetools { sourceSet sourceSets.main }
        goosetools_xaero_test { sourceSet sourceSets.xaeroRegressionTest }
        goosetools_camera_test { sourceSet sourceSets.cameraRenderTest }
        goosetools_flight_test { sourceSet sourceSets.flightRegressionTest }
    }
    runs {
        stationRegressionTest {
            client()
            source sourceSets.stationRegressionTest
            runDir providers.gradleProperty('withInvMove').isPresent() ? 'build/station-invmove-test' : 'build/station-regression-test'
            vmArg '-Dgoosetools.stationRegressionTest=true'
            vmArg '-Dgoosetools.stationWithInvMove=' + providers.gradleProperty('withInvMove').isPresent()
            programArg '--width'
            programArg '1280'
            programArg '--height'
            programArg '1000'
        }
        gameRegressionTest {
            client()
            source sourceSets.gameRegressionTest
            runDir 'build/game-regression-test'
            vmArg '-Dgoosetools.gameRegressionTest=true'
            vmArg '-Dgoosetools.trafficOnly=' + providers.gradleProperty('trafficOnly').isPresent()
            programArg '--width'
            programArg '1280'
            programArg '--height'
            programArg '900'
        }
        updateRegressionTest {
            client()
            source sourceSets.updateRegressionTest
            runDir 'build/update-regression-test'
            vmArg '-Dgoosetools.updateRegressionTest=true'
            programArg '--width'
            programArg '1100'
            programArg '--height'
            programArg '800'
        }
        taskRegressionTest {
            client()
            source sourceSets.taskRegressionTest
            runDir 'build/task-regression-test'
            vmArg '-Dgoosetools.taskRegressionTest=true'
            programArg '--width'
            programArg '1100'
            programArg '--height'
            programArg '800'
        }
        xaeroRegressionTest {
            client()
            source sourceSets.xaeroRegressionTest
            runDir 'build/xaero-regression-test'
            vmArg '-Dgoosetools.xaeroRegressionTest=true'
        }
        xaeroServerSmokeTest {
            server()
            runDir 'build/xaero-server-smoke-test'
        }
        cameraRenderTest {
            client()
            source sourceSets.cameraRenderTest
            runDir 'build/camera-render-test'
            vmArg '-Dgoosetools.cameraRenderTest=true'
        }
        flightRegressionTest {
            client()
            source sourceSets.flightRegressionTest
            runDir 'build/flight-regression-test'
            vmArg '-Dgoosetools.flightRegressionTest=true'
        }
        projectionRegressionTest {
            client()
            source sourceSets.flightRegressionTest
            runDir 'build/projection-regression-test'
            vmArg '-Dgoosetools.projectionRegressionTest=true'
        }
    }
}

// Local optional compatibility fixture; never a published dependency or included library.
if (providers.gradleProperty('withInvMove').isPresent()) {
    dependencies {
        stationRegressionTestRuntimeOnly files('../mods/InvMove-0.9.6+26.3-Fabric.jar', '../mods/cloth-config-26.3.158.jar')
    }
}
tasks.named('runStationRegressionTest') {
    timeout = java.time.Duration.ofMinutes(5)
    def directory = providers.gradleProperty('withInvMove').isPresent() ? 'station-invmove-test' : 'station-regression-test'
    doFirst {
        delete layout.buildDirectory.file(directory + '/result.txt')
        def options = layout.buildDirectory.file(directory + '/options.txt').get().asFile
        options.parentFile.mkdirs()
        options.text = 'lang:zh_cn\nguiScale:2\npauseOnLostFocus:false\ntutorialStep:none\nskipMultiplayerWarning:true\n'
    }
    doLast {
        def result = layout.buildDirectory.file(directory + '/result.txt').get().asFile
        if (!result.isFile() || !result.text.startsWith('PASS ')) {
            throw new GradleException('Station / input regression failed; inspect build/' + directory + '/logs/latest.log and result.txt')
        }
        logger.lifecycle(result.text)
    }
}

