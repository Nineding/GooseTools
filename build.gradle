plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "Xaero's Maven"
        url = "https://chocolateminecraft.com/maven"
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "xaero.minimap:xaerominimap-fabric-${minecraft_version}:${xaero_version}"
    implementation "xaero.map:xaeroworldmap-fabric-${minecraft_version}:${xaero_world_map_version}"

    // Embedded, client-safe libraries for the restricted server-driven Web UI.
    include(implementation("org.jsoup:jsoup:1.18.3"))
    include(implementation("org.mozilla:rhino:1.7.15"))

    testImplementation("org.junit.jupiter:junit-jupiter:5.11.4")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher:1.11.4")
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

test {
    useJUnitPlatform()
}

// An isolated client mod exercises real GPU draws; it is never packaged in the release JAR.
sourceSets {
    cameraRenderTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
configurations {
    cameraRenderTestImplementation.extendsFrom implementation
    cameraRenderTestRuntimeOnly.extendsFrom runtimeOnly
}
loom {
    mods {
        goosetools { sourceSet sourceSets.main }
        goosetools_camera_test { sourceSet sourceSets.cameraRenderTest }
    }
    runs {
        cameraRenderTest {
            client()
            source sourceSets.cameraRenderTest
            runDir 'build/camera-render-test'
            vmArg '-Dgoosetools.cameraRenderTest=true'
        }
    }
}

tasks.named('runCameraRenderTest') {
    timeout = java.time.Duration.ofMinutes(3)
    doFirst {
        delete layout.buildDirectory.file('camera-render-test/result.txt')
    }
    doLast {
        def result = layout.buildDirectory.file('camera-render-test/result.txt').get().asFile
        if (!result.isFile() || !result.text.startsWith('PASS ')) {
            throw new GradleException('Camera GPU regression failed; inspect build/camera-render-test/logs/latest.log and camera-gpu.png')
        }
        logger.lifecycle(result.text)
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}
